# PG18 data lives below the mounted /var/lib/postgresql directory.
listen_addresses = '127.0.0.1'
port = 55432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/pact-postgres/pg_hba.conf'
ssl = on
ssl_min_protocol_version = 'TLSv1.3'
ssl_cert_file = '/run/pact-postgres-tls/server.crt'
ssl_key_file = '/run/pact-postgres-tls/server.key'
password_encryption = 'scram-sha-256'
fsync = on
synchronous_commit = on
full_page_writes = on
max_connections = 24
shared_buffers = '128MB'
log_statement = 'none'
log_min_error_statement = 'panic'
log_connections = off
log_disconnections = off
