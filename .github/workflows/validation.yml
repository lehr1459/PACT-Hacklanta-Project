name: Repository validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_read_only:
        description: Also run public Devnet reads (RPC availability required; no signing or submissions)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            packages/pact-sdk/package-lock.json
            web/package-lock.json
            examples/pact-demo-app/package-lock.json
            examples/pact-platform-app/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Check runtime and install SDK first
        run: |
          node scripts/validation/run.mjs environment
          node scripts/validation/run.mjs install
      - name: Install Chromium and Linux browser dependencies
        run: node web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Node tests and package contracts from clean source
        run: |
          node scripts/validation/run.mjs node
          node scripts/validation/run.mjs packed
          node scripts/validation/run.mjs dependencies
          node scripts/validation/run.mjs artifacts
      - name: Prepare reproducible private SDK candidate (no publication)
        run: node scripts/release/sdk.mjs --consumer-report web/test-results/validation/packed/packed-consumer/report.json
      - name: Production builds and route smoke
        # Next type generation can rewrite tracked development references.
        # Keep clean SDK consumer/provenance checks ahead of that build output.
        run: node scripts/validation/run.mjs build
      - name: Synthetic browser regressions, sequential shared build directory
        run: |
          node scripts/validation/run.mjs browser-solana
          node scripts/validation/run.mjs browser-base
          node scripts/validation/run.mjs browser-integration
          node scripts/validation/run.mjs browser-checkout
          node scripts/validation/run.mjs browser-examples
          node scripts/validation/run.mjs external-saturday
      - name: Validation reports and browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-browser-validation
          path: |
            web/test-results/
            web/playwright-report/
            !web/test-results/**/node_modules/**
            !web/test-results/**/.next/**
          retention-days: 14

  pinned-chain:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        # Match the pinned build scripts' Windows PowerShell host. A pwsh ->
        # node -> powershell chain otherwise inherits incompatible module paths.
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Check runtime and committed evidence
        run: |
          node scripts/validation/run.mjs environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/validation/run.mjs artifacts
      - name: Verify pinned tools and execute chain suites
        run: node scripts/validation/run.mjs all-chain
      - name: Rebuild local provenance from clean committed source (no deployment)
        run: node scripts/solana/provenance.mjs --rebuild
      - name: Chain validation command receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinned-chain-validation
          path: |
            web/test-results/validation/
            solana/target/provenance-*/provenance.json
            solana/target/provenance-*/build.log
          retention-days: 14

  hosted-api-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: pact_test
          POSTGRES_PASSWORD: pact-local-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U pact_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PACT_HOSTED_QA_CLEAN: '1'
      PACT_QA_DATABASE_URL: postgresql://pact_test:pact-local-fixture-only@127.0.0.1:55439/pact_hosted_qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install --global npm@11.19.1
      - name: Install private local packages in dependency order
        run: node scripts/hosted-qa/run.mjs install
      - name: Install Chromium
        run: node web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Mandatory hosted SQL, contracts, examples, abuse and browser acceptance
        run: node scripts/hosted-qa/run.mjs all
      - name: Production artifact and container smoke (no push)
        run: node scripts/hosted-qa/artifact.mjs --docker
      - name: Scan and reconstruct allowlisted evidence
        id: safe-evidence
        if: always()
        run: |
          node scripts/hosted-qa/audit-console-artifacts.mjs web/test-results/hosted-console
          node scripts/hosted-qa/audit-console-artifacts.mjs web/test-results/hosted-connect
          node scripts/hosted-qa/export-receipts.mjs
      - name: Hosted summary receipts only
        if: always() && steps.safe-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-validation-summaries
          path: |
            web/test-results/hosted-export/matrix.json
            web/test-results/hosted-export/console.json
            web/test-results/hosted-export/connect.json
          if-no-files-found: error
          retention-days: 14

  hosted-portable-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PACT_HOSTED_QA_CLEAN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install --global npm@11.19.1
      - run: node scripts/hosted-qa/run.mjs install
      - name: Contracts, private client, adapters and secret-safe reporting
        run: node scripts/hosted-qa/run.mjs portable

  optional-public-reads:
    if: github.event_name == 'workflow_dispatch' && inputs.live_read_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install --global npm@11.19.1
      - run: node scripts/validation/run.mjs environment
      - run: node scripts/validation/run.mjs install
      - run: node web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Existing RPC allowlists forbid transaction methods
        run: node scripts/validation/run.mjs live-read
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optional-public-read-validation
          path: |
            web/test-results/
            web/playwright-report/
            !web/test-results/**/node_modules/**
            !web/test-results/**/.next/**
          retention-days: 14
